services:
  postgres:
    image: postgres:18.1-bookworm
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kitchen}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kitchen123}
      - POSTGRES_DB=${POSTGRES_DB:-kitchen}
    volumes:
      - ${PROJECT_ROOT:-.}/out/db:/var/lib/postgresql
    restart: always
    ports:
      - "5432:5432"
    networks:
      - avito-kitchen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitchen} -d ${POSTGRES_DB:-kitchen}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen-app
    ports:
      - "${HTTP_ADDR:-8080}:8080"
    environment:
      - HTTP_ADDR=${HTTP_ADDR:-:8080}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT:-5s}
      - WEBHOOK_PER_ATTEMPT_TIMEOUT=${WEBHOOK_PER_ATTEMPT_TIMEOUT:-5s}
      - WEBHOOK_MAX_ATTEMPTS=${WEBHOOK_MAX_ATTEMPTS:-3}
      - WEBHOOK_BACKOFF=${WEBHOOK_BACKOFF:-1s}
      - POSTGRES_USER=${POSTGRES_USER:-kitchen}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kitchen123}
      - POSTGRES_DB=${POSTGRES_DB:-kitchen}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT:-30s}
      - LOGGER_FOLDER=${LOGGER_FOLDER:-./out/logs/}
      - LOGGER_LEVEL=${LOGGER_LEVEL:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - avito-kitchen-network
    volumes:
      - ./logs:/app/logs

  restaurant-simulator:
    build:
      context: ./restaurant-simulator
      dockerfile: Dockerfile
    container_name: restaurant-simulator
    ports:
      - "8081:8081"
    environment:
      - MAIN_SERVICE_URL=http://app:8080
      - RESTAURANT_ID=123e4567-e89b-12d3-a456-426614174000
      - LISTEN_PORT=8081
      - LOG_LEVEL=info
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - avito-kitchen-network

  swagger:
    build: 
      context: ${PROJECT_ROOT:-.}
      dockerfile: docs/Dockerfile
    volumes:
      - ${PROJECT_ROOT:-.}:/code
    networks:
      - avito-kitchen-network

networks:
  avito-kitchen-network:
    driver: bridge