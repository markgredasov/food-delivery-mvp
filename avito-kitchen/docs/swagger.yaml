host: localhost:8080
info:
  contact: {}
  description: MVP API агрегатора доставки еды «Авито.Кухня».
  title: Avito Kitchen API
  version: 1.0.0
paths:
  /categories:
    get:
      consumes:
      - application/json
      description: Возвращает список зарегистрированных в сервисе категорий
      produces:
      - application/json
      responses:
        "200":
          description: Информация о заведении
          schema:
            $ref: '#/definitions/internal_handler_catalog.RestaurantDTO'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
      summary: Список категорий
      tags:
      - catalog
  /restaurants:
    get:
      consumes:
      - application/json
      description: Возвращает список активных заведений
      produces:
      - application/json
      responses:
        "200":
          description: Список зведений
          schema:
            $ref: '#/definitions/internal_handler_catalog.RestaurantsDTO'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
      summary: Список активных заведений
      tags:
      - catalog
  /restaurants/{id}:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о заведении
      parameters:
      - description: Идентификатор заведения
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Информация о заведении
          schema:
            $ref: '#/definitions/internal_handler_catalog.RestaurantDTO'
        "400":
          description: Невалидный запрос (неправильный формат UUID ресторана)
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
        "404":
          description: Заведение не найдено
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
      summary: Детали заведения
      tags:
      - catalog
  /restaurants/{id}/menu:
    get:
      consumes:
      - application/json
      description: Возвращает меню заведения
      parameters:
      - description: Идентификатор заведения
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Меню заведения
          schema:
            $ref: '#/definitions/internal_handler_catalog.MenuItemsDTO'
        "400":
          description: Невалидный запрос (неправильный формат UUID ресторана)
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
        "404":
          description: Заведение не найдено
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_talense-tasks_backend-trainee-assignment-autumn-2026-markgredasov-5b2b61ca_internal_server_http_response.ErrorResponse'
      summary: Меню заведения
      tags:
      - catalog
